# Match normal build admission without granting the build step API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proxy-build-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["appstudio-pipelines-scc"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxy-build-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxy-build-scc
subjects:
  - kind: ServiceAccount
    name: caching-proxy-regression-build
