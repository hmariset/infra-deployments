name: Test cert-manager Operator coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/cert-manager/**'
      - 'argo-cd-apps/base/member/infra-deployments/cert-manager/**'
      - 'argo-cd-apps/k-components/cert-manager-staging-clusters/**'
      - 'argo-cd-apps/k-components/deploy-to-all-staging-clusters/**'
      - 'argo-cd-apps/overlays/**'
      - 'hack/test-cert-manager-coverage.py'
      - 'hack/new-cluster/tasks/k-components.yaml'
      - '.github/workflows/test-cert-manager-coverage.yaml'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.x'
      - uses: multani/action-setup-kustomize@bf96e027caf74ab03bb3f79bac2addb331b28f1d # v1
        with:
          version: '5.8.1'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Check Operator ownership and destinations
        run: python hack/test-cert-manager-coverage.py
